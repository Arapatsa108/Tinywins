<title>Tiny Wins</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: one mobile column of chunky sticker cards, bottom tab bar, two floating quick buttons. Prayer and lights-off screens switch to a quiet serif gradient. */
:root{
  --bg:#F3F1FF; --surface:#FFFFFF; --soft:#E8E4FF; --ink:#211A4A; --muted:#625B8C; --edge:#211A4A; --shadowc:#211A4A;
  --coral:#FF5C6E; --sun:#FFC636; --mint:#1FCB98; --sky:#3BA3FF; --violet:#7258FF;
  --accent:#7258FF; --on-accent:#FFFFFF;
  --calm-a:#DDEAF6; --calm-b:#ECE6F6; --calm-ink:#2B3A5C; --calm-soft:#B9CBE6;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-calm:'Cormorant Garamond',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120E28; --surface:#1E1842; --soft:#2A2260; --ink:#F0EDFF; --muted:#A8A1D6; --edge:#5A4FB5; --shadowc:#070514;
  --calm-a:#0B1230; --calm-b:#1B1446; --calm-ink:#DCE6FF; --calm-soft:#3A4A85; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120E28; --surface:#1E1842; --soft:#2A2260; --ink:#F0EDFF; --muted:#A8A1D6; --edge:#5A4FB5; --shadowc:#070514;
  --calm-a:#0B1230; --calm-b:#1B1446; --calm-ink:#DCE6FF; --calm-soft:#3A4A85; color-scheme:dark}
:root[data-accent="lagoon"]{--accent:#0B8F8A}
:root[data-accent="berry"]{--accent:#D63A8E}
:root[data-accent="sunset"]{--accent:#E9561F}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding-block:14px 180px}
h1{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 8px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0 0 6px}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{flex:1;min-width:0}
.card{background:var(--surface);border:2.5px solid var(--edge);border-radius:22px;box-shadow:3px 3px 0 var(--shadowc);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.card.soft{background:var(--soft)}
.btn{font-family:var(--f-display);font-weight:600;font-size:17px;border:2.5px solid var(--edge);border-radius:16px;padding:10px 16px;min-height:48px;background:var(--surface);color:var(--ink);box-shadow:2px 2px 0 var(--shadowc);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadowc)}
.btn svg{width:22px;height:22px;flex:none}
.b-accent{background:var(--accent);color:var(--on-accent)}
.b-mint{background:var(--mint);color:#06281E}
.b-sun{background:var(--sun);color:#3A2A00}
.b-coral{background:var(--coral);color:#2B0610}
.b-ghost{background:transparent;box-shadow:none}
.btn.big{min-height:62px;font-size:20px;width:100%}
.btn.sm{min-height:40px;font-size:15px;padding:6px 12px;border-radius:13px}
.icbtn{width:44px;height:44px;flex:none;border-radius:14px;border:2.5px solid var(--edge);background:var(--surface);display:grid;place-items:center;box-shadow:2px 2px 0 var(--shadowc)}
.icbtn svg{width:22px;height:22px}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=text],input[type=number],input[type=time],textarea,.inp{width:100%;min-width:0;background:var(--surface);border:2.5px solid var(--edge);border-radius:14px;padding:11px 13px;font-size:17px}
textarea{resize:vertical;line-height:1.4}
.inrow{display:flex;gap:8px;align-items:stretch}
.mic.rec{background:var(--coral)}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--edge);border-radius:99px;padding:3px 11px;font-family:var(--f-display);font-weight:500;font-size:14px;background:var(--surface)}
.lbl{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}

/* home */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hello .grow h1{font-size:26px}
.crit{width:54px;height:54px;flex:none;background:none;border:0;padding:0}
.aff{width:100%;text-align:left;background:var(--accent);color:var(--on-accent);border:2.5px solid var(--edge);border-radius:24px;box-shadow:4px 4px 0 var(--shadowc);padding:18px}
.aff .big{font-family:var(--f-display);font-weight:600;font-size:25px;line-height:1.15;text-wrap:balance}
.aff .more{font-size:15px;margin-top:10px;opacity:.95}
.aff .hint{font-size:13px;margin-top:8px;opacity:.85}
.now{display:flex;flex-direction:column;gap:10px}
.now .t{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.15}
.goalrow{display:flex;gap:12px;align-items:center}
.tickbtn{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--edge);background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:2px 2px 0 var(--shadowc)}
.tickbtn svg{width:28px;height:28px;opacity:.25}
.tickbtn.on{background:var(--mint)}
.tickbtn.on svg{opacity:1;color:#06281E}
.goaltxt{font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.goaltxt.done{text-decoration:line-through;opacity:.6}
.plain{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;min-width:0;overflow-wrap:anywhere}
.qt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 2px;border:2.5px solid var(--edge);border-radius:18px;background:var(--surface);font-family:var(--f-display);font-weight:500;font-size:13px;box-shadow:2px 2px 0 var(--shadowc)}
.qb svg{width:28px;height:28px}
.qb.on{background:var(--mint);color:#06281E}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:76px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 8px;border:2.5px solid var(--edge);border-radius:16px;background:var(--surface);font-family:var(--f-display);font-size:12px}
.chip b{font-weight:600;font-size:14px}
.chip.done{background:var(--mint);color:#06281E}
.chip.cur{background:var(--sun);color:#3A2A00;transform:translateY(-2px)}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2.5px solid var(--edge);display:flex;justify-content:space-around;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-display);font-weight:500;font-size:11px;color:var(--muted);background:none;border:0;padding:4px 0;min-height:48px}
.tab span.i{display:grid;place-items:center;width:46px;height:28px;border-radius:14px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab.on span.i{background:var(--accent);color:var(--on-accent)}
.fabs{position:fixed;z-index:19;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:flex;flex-direction:column;gap:10px}
.fab{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--edge);box-shadow:3px 3px 0 var(--shadowc);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.fab.y{background:var(--sun);color:#3A2A00}
.fab.c{background:var(--surface)}

/* overlays */
.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(10,6,30,.55)}
.sheet-body{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--bg);border-top:2.5px solid var(--edge);border-radius:26px 26px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sx{display:flex;justify-content:flex-end;margin:-6px 0 -8px}
#rw{position:fixed;z-index:50;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 10px);max-width:500px;margin:0 auto;pointer-events:none;opacity:0;transform:translateY(-16px) scale(.97);transition:opacity .2s,transform .25s}
#rw.show{opacity:1;transform:none;pointer-events:auto}
#rw .card{background:var(--sun);color:#2A1E00;border-color:#211A4A;box-shadow:4px 4px 0 #211A4A}
#rw.calm .card{background:var(--calm-a);color:var(--calm-ink);font-family:var(--f-calm);font-size:19px}
#rw .m{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.2}
#rw.calm .m{font-family:var(--f-calm);font-weight:600;font-size:22px}
#rw .x{font-size:15px;margin-top:6px;font-style:italic}
#rw .p{font-family:var(--f-display);font-weight:600;font-size:14px;margin-top:4px}
#nudge{position:fixed;z-index:45;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 10px);max-width:500px;margin:0 auto;display:none}
#nudge.show{display:block}
#msg{position:fixed;z-index:55;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);max-width:88%;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#msg.show{opacity:1}

.face{flex:1;min-width:0;font-size:30px;line-height:1;padding:12px 0;border:2.5px solid var(--edge);border-radius:16px;background:var(--surface);box-shadow:2px 2px 0 var(--shadowc)}

.dots{display:flex;gap:6px;justify-content:space-between}
.dotc{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-display);font-size:12px;color:var(--muted)}
.dot{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--edge);background:var(--surface);display:grid;place-items:center}
.dot svg{width:18px;height:18px;opacity:0}
.dot.on{background:var(--mint);color:#06281E}
.dot.on svg{opacity:1}
.dot.today{outline:3px solid var(--sky);outline-offset:1px}
.dot.fut{opacity:.4}
.bar{height:14px;border:2.5px solid var(--edge);border-radius:99px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .4s}
.bigstat{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stats div{min-width:70px}

/* timer */
.tw{position:relative;width:min(70vw,250px);aspect-ratio:1;margin:4px auto}
.tsvg{width:100%;height:100%}
.tbg{fill:none;stroke:var(--soft);stroke-width:16}
.tarc{fill:none;stroke:var(--accent);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.tnum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:clamp(40px,14vw,58px);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chp{border:2.5px solid var(--edge);background:var(--surface);border-radius:99px;padding:5px 14px;font-family:var(--f-display);font-weight:500;font-size:15px;min-height:38px}
.chp.on{background:var(--accent);color:var(--on-accent)}
.bd{background:linear-gradient(120deg,var(--soft),var(--calm-a),var(--soft));background-size:300% 300%;animation:drift 14s ease-in-out infinite}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mint);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.2);opacity:1}}

/* calm screens */

.calm h1{font-family:var(--f-calm);font-weight:600;font-size:36px}
.calm p{font-family:var(--f-calm);font-size:21px;font-style:italic;margin:0}
.cbtn{font-family:var(--f-calm);font-weight:600;font-size:24px;border:2px solid var(--calm-soft);background:transparent;color:var(--calm-ink);border-radius:99px;padding:16px 30px;min-height:56px}
.cbtn.main{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--calm-soft),transparent 75%);font-size:26px;box-shadow:0 0 40px var(--calm-soft)}
.cbtn.main.done{background:radial-gradient(circle at 40% 35%,rgba(255,236,170,.7),transparent 75%)}
.breath{position:relative;width:200px;height:200px;display:grid;place-items:center}
.breath i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--calm-soft),transparent 70%);animation:br 10s ease-in-out infinite;box-shadow:0 0 50px var(--calm-soft)}
@keyframes br{0%,100%{transform:scale(.55)}40%{transform:scale(1)}}
.breath span{position:relative;font-family:var(--f-calm);font-size:26px;font-style:italic}
.br-in{animation:fa 10s infinite}
.br-out{position:absolute!important;animation:fb 10s infinite}
@keyframes fa{0%,38%{opacity:1}44%,96%{opacity:0}100%{opacity:1}}
@keyframes fb{0%,38%{opacity:0}44%,96%{opacity:1}100%{opacity:0}}

.calmcard .total{font-family:var(--f-calm);font-weight:600;font-size:44px;line-height:1;background:none;border:0;padding:0;color:inherit;font-variant-numeric:tabular-nums}
.calmcard .btn{border-color:var(--calm-soft);box-shadow:none;background:var(--surface);color:var(--ink)}
.calmcard .btn.b-accent{background:var(--accent);color:var(--on-accent)}

/* lists */
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--soft)}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.li .tx.done{text-decoration:line-through;opacity:.55}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mi{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border:2.5px solid var(--edge);border-radius:20px;background:var(--surface);box-shadow:3px 3px 0 var(--shadowc);font-family:var(--f-display);font-weight:600;font-size:17px;text-align:left}

.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bg{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;font-weight:700}
.bg svg{width:44px;height:44px}
.chart{width:100%;height:auto;display:block}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart .ar{fill:var(--accent);opacity:.16}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart text{fill:var(--muted);font:600 11px var(--f-body)}
.chart .gl{stroke:var(--soft);stroke-width:1.5}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
.mbar{width:100%;max-width:34px;height:90px;display:flex;align-items:flex-end;border-radius:10px;background:var(--soft)}
.mbar i{display:block;width:100%;border-radius:10px;border:2px solid var(--edge)}
.ring{width:46px;height:46px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .b{stroke:var(--calm-soft)}
.ring .f{stroke:var(--accent);stroke-linecap:round}
.tog{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:10px 0;min-height:48px;border-bottom:2px dashed var(--soft)}

.trow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0}

.crit-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.blink{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const COL=['#FF5C6E','#FFC636','#1FCB98','#3BA3FF','#7258FF','#FF8A3D'];
function starPath(c,r){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();c.fill()}
function confetti(kind){
  if(!S.settings.confetti||reduceMotion)return;
  const st=pick(['burst','rain','stars','pop']),n=kind==='big'?150:55,W=innerWidth,H=innerHeight;
  for(let i=0;i<n;i++){
    const p={x:W/2,y:H*.6,vx:0,vy:0,g:.25,r:3+Math.random()*4,c:pick(COL),a:Math.random()*6,va:(Math.random()-.5)*.3,life:90+Math.random()*50,t:0,shape:'rect'};
    if(st==='burst'){const an=Math.random()*Math.PI*2,sp=4+Math.random()*(kind==='big'?10:7);p.vx=Math.cos(an)*sp;p.vy=Math.sin(an)*sp-5}
    else if(st==='rain'){p.x=Math.random()*W;p.y=-10-Math.random()*H*.3;p.vx=(Math.random()-.5)*2;p.vy=2+Math.random()*3;p.g=.05;p.life=170}
    else if(st==='stars'){p.x=Math.random()*W;p.y=H*.3+Math.random()*H*.4;p.vx=(Math.random()-.5)*2;p.vy=-1-Math.random()*2;p.g=.02;p.shape='star';p.r=6+Math.random()*6;p.life=70+Math.random()*40}
    else{const an=-Math.PI/2+(Math.random()-.5)*1.6,sp=6+Math.random()*8;p.vx=Math.cos(an)*sp*(Math.random()<.5?1:-1)*.5;p.vy=Math.sin(an)*sp;p.x=W*(Math.random()<.5?.12:.88);p.y=H*.85;p.shape='circle'}
    parts.push(p)}
  if(!raf)raf=requestAnimationFrame(loop)}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.t<p.life);
  for(const p of parts){p.t++;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;
    cx.globalAlpha=Math.max(0,Math.min(1,(p.life-p.t)/25));cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);
    if(p.shape==='star')starPath(cx,p.r);else if(p.shape==='circle'){cx.beginPath();cx.arc(0,0,p.r,0,7);cx.fill()}else cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
    cx.restore()}
  cx.globalAlpha=1;raf=parts.length?requestAnimationFrame(loop):0}
/* clips are synthesised as WAV and played through <audio> elements, which iOS lets through the silent switch */
const AU={pool:[],i:0,cache:{},ok:false,noise:null,noiseUrl:null,silent:null};
function wavUrl(samples,rate){
  const n=samples.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){v.setInt16(44+i*2,Math.max(-1,Math.min(1,samples[i]))*32767,true)}
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}))}
function synth(fs,o){
  o=o||{};const rate=22050,dur=o.dur||.14,gap=o.gap||.1,vol=o.vol||.6,tail=o.tail||.35,decay=o.decay||7,len=Math.ceil(((fs.length-1)*gap+dur+tail)*rate),out=new Float32Array(len);
  fs.forEach((f,k)=>{const st=Math.floor(k*gap*rate),nn=Math.floor((dur+tail)*rate);
    for(let i=0;i<nn&&st+i<len;i++){const t=i/rate,env=Math.min(1,t/.012)*Math.exp(-t*decay),ph=2*Math.PI*f*t,sm=o.type==='triangle'?(2/Math.PI)*Math.asin(Math.sin(ph)):Math.sin(ph);out[st+i]+=sm*env*vol}});
  let pk=0;for(let i=0;i<len;i++)pk=Math.max(pk,Math.abs(out[i]));
  if(pk>.9)for(let i=0;i<len;i++)out[i]*=.9/pk;
  return out}
const CLIPS={pling:[[660,880,1175],{type:'triangle',gap:.09,dur:.12,decay:8}],chime:[[528,792],{dur:.9,gap:.35,decay:2.6,tail:.8,vol:.5}],fanfare:[[523,659,784,1047],{type:'triangle',gap:.1,dur:.2,decay:5}],soft:[[528],{dur:.4,decay:5,vol:.45}]};

function audioInit(){

  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}

function audioUnlock(){
  if(AU.ok)return;audioInit();

['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,audioUnlock,{passive:true,capture:true}));
function play(name){
  if(!S.settings.sound)return;

const pling=()=>play('pling'),chime=()=>play('chime'),fanfare=()=>play('fanfare');
function noise(on){
  try{
    if(!on){if(AU.noise)AU.noise.pause();return}
    if(!S.settings.sound)return;
    if(!AU.noiseUrl){
      const rate=11025,N=rate*8,M=rate,raw=new Float32Array(N+M);let last=0,pk=0;
      for(let i=0;i<raw.length;i++){last=(last+.02*(Math.random()*2-1))/1.02;raw[i]=last;pk=Math.max(pk,Math.abs(last))}
      const out=new Float32Array(N);
      for(let i=0;i<N;i++){const x=i<M?raw[i]*(i/M)+raw[N+i]*(1-i/M):raw[i];out[i]=x/pk*.3}
      AU.noiseUrl=wavUrl(out,rate)}

/* ---------- habits ---------- */
function habitStats(h){
  const ks=Object.keys(S.days).filter(k=>S.days[k][h]).sort();let cur=0,best=0,last=null;
  for(const k of ks){if(last===null)cur=1;else{const gap=diffDays(last,k)-1;cur=gap<=1?cur+1:Math.max(1,Math.ceil(cur/2))}last=k;best=Math.max(best,cur)}
  const since=last?diffDays(last,today()):null;
  return{cur,best,last,since,active:last!==null&&since<=2}}
function weekTotal(h){const ws=weekStart(today());let n=0;for(let i=0;i<7;i++)if(Dg(addDays(ws,i))[h])n++;return n}
function tickHabit(h){
  const d=D();
  if(d[h]){d[h]=false;save();render();return}
  const before=habitStats(h);
  d[h]=true;save();
  const calm=h==='pray'&&!S.settings.prayerConfetti,after=habitStats(h);
  const MS=[3,7,14,30],hit=h in {pray:1,move:1,vit:1}&&MS.includes(after.cur);
  const back=before.last&&before.since>2;
  if(hit){reward(h==='pray'?'pray':h,{calm:calm,big:!calm,pts:30,extra:T(after.cur+' days in a row. Lovely rhythm.',after.cur+' jours de suite. Beau rythme.')});award(h+'_'+after.cur,calm)}
  else if(back){reward(h,{calm:calm,extra:T('Back at it, that’s what counts!','Te revoilà, c’est ça qui compte !')});award('comeback',calm)}
  else reward(h,{calm:calm});
  render()}

function recAdd(id,n){

    showReward(T('You reached '+num(m)+'. Quietly wonderful.','Tu as atteint '+num(m)+'. Calmement merveilleux.'),0,r.name,calm);

function micBtn(id){return '<button class="icbtn mic" data-act="voice" data-v="'+id+'" aria-label="'+T('Speak','Dicter')+'">'+ic('mic')+'</button>'}
let rec=null;
function voice(id,btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,el=document.getElementById(id);
  const fallback=m=>{toast(m||T('Dictation is blocked here. Tap the field and use the microphone key on your keyboard.','La dictée est bloquée ici. Touche le champ et utilise la touche micro du clavier.'));if(el)el.focus()};
  if(rec){try{rec.stop()}catch(e){}rec=null;btn.classList.remove('rec');return}
  if(!SR){fallback();return}
  try{
    const r=new SR();rec=r;r.lang=S.settings.lang==='fr'?'fr-FR':'en-US';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
    const base=el?el.value:'';btn.classList.add('rec');toast(T('Listening…','J’écoute…'));
    r.onresult=e=>{let txt='';for(let i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;if(el)el.value=(base?base+' ':'')+txt};
    r.onerror=e=>{btn.classList.remove('rec');rec=null;const c=e&&e.error;
      fallback(c==='no-speech'?T('Heard nothing. Try again.','Rien entendu. Réessaie.'):(c==='not-allowed'||c==='service-not-allowed')?T('Microphone not allowed here. Use the keyboard microphone key.','Micro non autorisé ici. Utilise la touche micro du clavier.'):null)};
    r.onend=()=>{btn.classList.remove('rec');rec=null};
    r.start()
  }catch(e){btn.classList.remove('rec');rec=null;fallback()}}

  setTimeout(()=>{const i=$('#askIn');if(i)i.focus()},60)}

/* ---------- critter ---------- */
function critter(lv){
  const s=Math.min(1.25,.8+lv*.05),c=lv>=5?'var(--sun)':'var(--accent)';
  return '<svg viewBox="0 0 100 100" class="crit-svg" aria-hidden="true" style="width:100%;height:100%"><g transform="translate(50 56) scale('+s+') translate(-50 -56)">'+
   (lv>=2?'<path d="M50 24c0-8 4-12 10-13-1 7-4 11-10 13z" fill="var(--mint)" stroke="var(--edge)" stroke-width="3" stroke-linejoin="round"/>':'')+
   (lv>=5?'<path d="M34 28l5-9 6 7 5-9 5 9 6-7 5 9z" fill="var(--sun)" stroke="var(--edge)" stroke-width="3" stroke-linejoin="round"/>':'')+
   '<ellipse cx="50" cy="60" rx="31" ry="28" fill="'+c+'" stroke="var(--edge)" stroke-width="3.5"/>'+
   '<g class="blink"><circle cx="39" cy="55" r="5" fill="#fff" stroke="var(--edge)" stroke-width="2.5"/><circle cx="61" cy="55" r="5" fill="#fff" stroke="var(--edge)" stroke-width="2.5"/><circle cx="40" cy="56" r="2.2" fill="#211A4A"/><circle cx="60" cy="56" r="2.2" fill="#211A4A"/></g>'+
   '<path d="M43 68q7 7 14 0" fill="none" stroke="#211A4A" stroke-width="3" stroke-linecap="round"/>'+
   (lv>=3?'<circle cx="31" cy="66" r="4" fill="var(--coral)" opacity=".7"/><circle cx="69" cy="66" r="4" fill="var(--coral)" opacity=".7"/>':'')+'</g></svg>'}

function curStep(p){return p?(p.steps.find(s=>s.id===p.focus&&!s.done)||p.steps.find(s=>!s.done)):null}
function projWithSteps(){const p=Dg().project;return p&&p.steps.some(s=>!s.done)?p:null}
function lastOpenProject(){const ks=Object.keys(S.days).filter(k=>k<today()).sort().reverse();for(const k of ks){const p=S.days[k].project;if(p&&!p.done&&p.steps.some(s=>!s.done))return{k:k,p:p}}return null}
function saMs(txt){const m=String(txt||'').match(/(\d+)\s*minutes?\b/i);return (m?Math.min(60,Math.max(1,+m[1])):2)*60000}
function saCtx(){
  const proj=projWithSteps();
  if(S.meta.saMode==='project'&&proj){const st=proj.steps.find(x=>x.id===S.meta.saStep&&!x.done);return st?{ref:'p:'+st.id,ms:st.mins*60000,step:st}:{ref:null,step:null}}
  return{ref:'sa',ms:saMs(S.meta.sa),step:null}}
function cancelSa(){const t=S.meta.timer;if(t&&t.kind==='sa'){S.meta.timer=null;save()}}
function completeStep(id){
  const d=D(),p=d.project;if(!p)return;const c=p.steps.find(s=>s.id===id);if(!c||c.done)return;
  c.done=true;d.steps=(d.steps||0)+1;
  const t=S.meta.timer;if(t&&t.kind==='proj'&&String(t.ref)===id)timerCancel();
  if(p.focus===id)p.focus=null;
  if(p.steps.every(s=>s.done)){p.done=true;save();reward('project',{pts:60,big:true,extra:T('Treat yourself: ','Fais-toi plaisir : ')+pick(treatList())});award('proj1')}
  else{save();reward('step',{pts:15})}
  render()}

function wins(d,k){
  const w=[];
  if(d.mood!=null||d.mood2!=null)w.push(T('You checked in with how you feel','Tu as pris de tes nouvelles'));
  if(d.vit)w.push(T('Vitamins taken','Vitamines prises'));
  if(d.move)w.push(T('You moved your body','Tu as bougé'));
  if(d.water)w.push(T('You drank some water','Tu as bu de l’eau'));
  if(d.food)w.push(T('You ate','Tu as mangé'));
  if(d.goal&&d.goal.done)w.push(T('Goal finished: ','Objectif atteint : ')+d.goal.text);
  else if(d.goal)w.push(T('You picked a goal: ','Tu as choisi un objectif : ')+d.goal.text);
  if(d.steps>0)w.push(d.steps+' '+T(d.steps>1?'project steps finished':'project step finished',d.steps>1?'étapes de projet finies':'étape de projet finie'));
  if(d.project&&d.project.done)w.push(T('Project finished: ','Projet terminé : ')+d.project.name);
  if(d.pray)w.push(T('Evening prayers','Prières du soir'));
  S.recs.forEach(r=>{const n=r.log.filter(e=>e.t==='add'&&e.k===k).reduce((a,e)=>a+e.d,0);if(n>0)w.push(T('Recited ','Récité ')+num(n)+' · '+r.name)});
  const dumps=S.inbox.filter(i=>dkey(new Date(i.ts))===k).length;
  if(dumps)w.push(T('You parked '+dumps+' thought'+(dumps>1?'s':'')+' safely','Tu as mis '+dumps+' pensée'+(dumps>1?'s':'')+' de côté'));

function spark(r){
  if(!r.log.length)return '<p class="muted small">'+T('The chart appears after your first count.','Le graphique apparaît après ton premier comptage.')+'</p>';
  const t=today(),first=r.log.map(e=>e.k).sort()[0],start=diffDays(first,t)>29?addDays(t,-29):first,n=diffDays(start,t)+1;
  const base=r.log.filter(e=>e.k<start).reduce((a,e)=>a+e.d,0),vals=[];let run=base;
  for(let i=0;i<n;i++){const k=addDays(start,i);run+=r.log.filter(e=>e.k===k).reduce((a,e)=>a+e.d,0);vals.push(run)}
  const mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals),W=300,H=110,L=8,R=8,Tp=12,B=22,rg=(mx-mn)||1;
  const X=i=>L+(n<2?(W-L-R)/2:i*(W-L-R)/(n-1)),Y=v=>Tp+(H-Tp-B)*(1-(v-mn)/rg);
  const pts=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+T('Total over time','Total au fil du temps')+'"><line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'"/><polygon class="ar" points="'+X(0)+','+(H-B)+' '+pts+' '+X(n-1)+','+(H-B)+'"/><polyline class="ln" points="'+pts+'"/><circle class="pt" cx="'+X(n-1).toFixed(1)+'" cy="'+Y(vals[n-1]).toFixed(1)+'" r="5"/><text x="'+L+'" y="'+(H-6)+'">'+esc(new Date(start+'T12:00:00').toLocaleDateString(loc(),{day:'numeric',month:'short'}))+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+esc(num(vals[n-1]))+'</text></svg>'}

   catch(e){toast(T('That does not look like a backup','Ce n’est pas une sauvegarde valide'))}},
 restoreGo:()=>{const o=window.__restore,d=defaults();S=Object.assign(d,o);S.settings=Object.assign(defaults().settings,o.settings);S.settings.times=Object.assign(defaults().settings.times,o.settings.times||{});S.meta=Object.assign(defaults().meta,o.meta||{});persist();closeSheet();go('home');toast(T('Restored','Restauré'))},
 resetAsk:()=>sheet('<h2>'+T('Erase all data?','Effacer toutes les données ?')+'</h2><p class="muted">'+T('This cannot be undone. Copy a backup first if you are unsure.','Impossible d’annuler. Copie d’abord une sauvegarde en cas de doute.')+'</p><div class="row"><button class="btn b-coral grow" data-act="resetGo">'+T('Erase','Effacer')+'</button><button class="btn grow" data-act="closeSheet">'+T('Keep my data','Garder mes données')+'</button></div>'),
 resetGo:()=>{const l=S.settings.lang;S=defaults();S.settings.lang=l;S.meta.welcomed=true;persist();closeSheet();go('home')},
 welcomeOk:()=>{S.meta.welcomed=true;save();closeSheet()},
 nudgeGo:el=>{hideNudge();const k=el.dataset.v;S.meta.nudge[today()+k]='dismissed';save();openAnchor(k)},
 nudgeSnooze:el=>{hideNudge();S.meta.nudge[today()+el.dataset.v]='z:'+(Date.now()+15*60000);save();toast(T('Okay, I’ll ask again in 15 minutes','D’accord, je redemande dans 15 minutes'))},
 nudgeSkip:el=>{hideNudge();S.meta.nudge[today()+el.dataset.v]='dismissed';save()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=acts[el.dataset.act];if(f){e.preventDefault();f(el)}});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-in]');if(!el)return;
  const k=el.dataset.in;
  if(k==='note'){D().note=el.value;save()}
  else if(k.startsWith('time:')){S.settings.times[k.slice(5)]=el.value||S.settings.times[k.slice(5)];save()}
  else if(k.startsWith('msg:')){const f=k.slice(4),v=el.value.trim(),def={bestShort:bestShortDef,bestLong:bestLongDef,loadMsg:loadDef}[f]();S.settings[f]=v===def?'':v;save();toast(T('Saved','Enregistré'))}
  else if(k==='tiny'){const l=el.value.split('\n').map(x=>x.trim()).filter(Boolean);S.tiny=l.length?l:null;save();toast(T('Saved','Enregistré'))}
  else if(k==='file'){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const t=$('#bk');if(t){t.value=String(r.result||'');acts.restoreAsk()}};r.readAsText(f)}});
const bestShortDef=()=>T(DEF.bs[0],DEF.bs[1]),bestLongDef=()=>T(DEF.bl[0],DEF.bl[1]),loadDef=()=>T(DEF.load[0],DEF.load[1]);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='askIn'&&e.target.tagName==='INPUT'){acts.askOk()}if(e.key==='Enter'&&e.target.id==='gnew'){acts.goalNew()}});

/* ---------- loop ---------- */
setInterval(()=>{
  const t=S.meta.timer;
  if(t&&t.end&&Date.now()>=t.end)timerEnd();
  paintTimer()},500);
setInterval(()=>{if(!$('#sheet').classList.contains('open')&&!$('#nudge').classList.contains('show'))nudgeTick()},20000);
let lastDay=today();
setInterval(()=>{if(today()!==lastDay){lastDay=today();render()}},60000);

/* ---------- start ---------- */
function start(){
  S.meta.bd=false;wake();
  try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  Object.keys(S.meta.nudge).forEach(k=>{if(k.slice(0,10)!==today())delete S.meta.nudge[k]});
  render();
  if(!S.meta.welcomed){
    S.meta.welcomed=true;save();
    sheet('<h2>'+T('Welcome to Tiny Wins','Bienvenue dans Tiny Wins')+'</h2><p>'+T('One rule here: no guilt, ever. Everything is optional and everything can be changed. A missed day just means a quiet day.','Une seule règle ici : jamais de culpabilité. Tout est facultatif et tout peut être modifié. Un jour manqué est juste un jour calme.')+'</p><p class="muted small">'+T('Your data stays on this device. Use the same page each time.','Tes données restent sur cet appareil. Utilise toujours la même page.')+'</p><button class="btn b-accent big" data-act="welcomeOk">'+T('Let’s go','C’est parti')+'</button>');
    return}
  const t=today(),sun=new Date().getDay()===0;
  if(sun&&new Date().getHours()<13&&(!S.meta.loadShown||diffDays(S.meta.loadShown,t)>=14)){S.meta.loadShown=t;save();loadSheet()}
  else if(sun&&S.meta.sundayShown!==t){S.meta.sundayShown=t;save();go('week')}
  setTimeout(nudgeTick,1500)}
start();
})();
</script>

</body></html>
